# Production deployment for the mdex gateway (remote MCP server).
#
# This is a REDACTED template. Copy it to your deploy host, fill in the secrets,
# and keep your filled-in copy OUT of version control. Secrets below are placeholders.
#
# Topology: the gateway runs behind an nginx-proxy + letsencrypt companion on a shared
# external docker network. nginx-proxy terminates TLS and routes VIRTUAL_HOST -> VIRTUAL_PORT.
#
# Redeploy after a code change:
#   docker compose up -d --build
# (builds the working tree of the mdex-tooling checkout referenced by `build:`)

services:
  mdex-gateway:
    build: /path/to/mdex-tooling          # local checkout of this repo
    image: mdex-gateway:local
    container_name: mdex-gateway
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MDEX_ROOT: /vault                    # data vault (mounted below) — NOT the code repo
      MDEX_GATEWAY_TOKENS: /tokens/tokens.json
      # OpenIddict store (OAuth authorizations + refresh tokens). Optional — defaults to
      # openiddict.db next to MDEX_GATEWAY_TOKENS, i.e. /tokens/openiddict.db on the volume below.
      # MDEX_OPENIDDICT_DB: /tokens/openiddict.db

      # Persistent OAuth signing key (see deploy/README.md to generate signing.pfx).
      # Without these the gateway uses an ephemeral key and invalidates all tokens on restart.
      MDEX_SIGNING_CERT_PATH: /certs/signing.pfx
      MDEX_SIGNING_CERT_PASS: "REPLACE_WITH_PFX_PASSWORD"

      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:3001"

      # nginx-proxy / letsencrypt-companion routing
      VIRTUAL_HOST: mdex-mcp.example.com
      VIRTUAL_PORT: "3001"
      LETSENCRYPT_HOST: mdex-mcp.example.com
      LETSENCRYPT_EMAIL: you@example.com

      # OAuth clients (id/secret/scopes/redirect URIs) are defined in the watched clients.json on the
      # /tokens volume — see deploy/README.md "OAuth clients". Edit that file to add a redirect URI or
      # rotate a secret; changes apply at runtime, no rebuild. Optional path override:
      # MDEX_OAUTH_CLIENTS: /tokens/clients.json
      # git identity + safe.directory for the commit_and_push tool (shells out to git in /vault).
      GIT_AUTHOR_NAME: "Your Name"
      GIT_AUTHOR_EMAIL: "you@example.com"
      GIT_COMMITTER_NAME: "Your Name"
      GIT_COMMITTER_EMAIL: "you@example.com"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "/vault"
      GIT_CONFIG_KEY_1: "safe.directory"
      GIT_CONFIG_VALUE_1: "/path/to/vault-origin-remote"
    volumes:
      - /path/to/mdex-vault:/vault         # data vault (read/write)
      # If the vault's 'origin' remote is a local path (e.g. a bare repo), mount it at the SAME
      # path so commit_and_push can pull/push. Omit if origin is a remote URL with creds available.
      # - /path/to/vault-origin-remote:/path/to/vault-origin-remote
      - ./tokens:/tokens                   # token store (persisted)
      - ./certs:/certs:ro                  # signing cert (read-only)
    networks: [proxy]

networks:
  proxy:
    external: true
    name: nextcloud-docker_nextcloud_network
